spring.application.name=forja-gym
server.port=8080

# ---- Base de datos MySQL (cambia usuario/clave si usaste otros) ----
spring.datasource.url=jdbc:mysql://localhost:3306/forja_gym?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=gym_user
spring.datasource.password=gym1234

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Carga clientes y clases de ejemplo la primera vez (pon false para no cargarlos)
forja.datos-demo=true
