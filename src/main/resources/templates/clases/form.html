<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear clase')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('clases')}"></aside>
    <main class="contenido">
        <div class="cabecera"><h1>Crear clase</h1></div>

        <form class="form" th:action="@{/clases}" th:object="${clase}" method="post" novalidate>
            <label class="campo">Nombre de la clase
                <input type="text" th:field="*{nombre}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </label>

            <label class="campo">Instructor
                <input type="text" th:field="*{instructor}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}"></span>
            </label>

            <label class="campo">Fecha y hora
                <input type="datetime-local" th:field="*{fechaHora}">
                <span class="error" th:if="${#fields.hasErrors('fechaHora')}" th:errors="*{fechaHora}"></span>
            </label>

            <label class="campo">Cupos
                <input type="number" th:field="*{cupo}" min="1">
                <span class="error" th:if="${#fields.hasErrors('cupo')}" th:errors="*{cupo}"></span>
            </label>

            <div class="form-acciones">
                <button type="submit" class="btn btn-brasa">Guardar clase</button>
                <a class="btn btn-linea" th:href="@{/clases}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
