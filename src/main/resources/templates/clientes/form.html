<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('clientes')}"></aside>
    <main class="contenido">
        <div class="cabecera">
            <h1 th:text="${cliente.id == null} ? 'Registrar cliente' : 'Editar cliente'">Registrar cliente</h1>
        </div>

        <form class="form" th:action="@{/clientes}" th:object="${cliente}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <label class="campo">Nombre
                <input type="text" th:field="*{nombre}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </label>

            <label class="campo">Apellidos
                <input type="text" th:field="*{apellido}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
            </label>

            <label class="campo">DNI
                <input type="text" th:field="*{dni}" inputmode="numeric" maxlength="8" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></span>
            </label>

            <label class="campo">Teléfono
                <input type="tel" th:field="*{telefono}" autocomplete="off">
            </label>

            <label class="campo campo-ancho">Correo electrónico
                <input type="email" th:field="*{email}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </label>

            <div class="form-acciones">
                <button type="submit" class="btn btn-brasa">Guardar cliente</button>
                <a class="btn btn-linea" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
