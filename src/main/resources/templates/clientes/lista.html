<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('clientes')}"></aside>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="cabecera">
            <h1>Clientes</h1>
            <a class="btn btn-brasa" th:href="@{/clientes/nuevo}">Registrar cliente</a>
        </div>

        <form class="buscador" th:action="@{/clientes}" method="get">
            <input type="search" name="q" th:value="${q}" placeholder="Buscar por nombre, apellido o DNI" aria-label="Buscar cliente">
            <button type="submit" class="btn">Buscar</button>
        </form>

        <p class="vacio" th:if="${#lists.isEmpty(clientes)}">No se encontraron clientes.</p>
        <div class="tabla-wrap" th:unless="${#lists.isEmpty(clientes)}">
            <table class="tabla">
                <thead>
                <tr><th>Cliente</th><th>DNI</th><th>Teléfono</th><th>Membresía</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td><a th:href="@{/clientes/{id}(id=${c.id})}" th:text="${c.nombreCompleto}">Cliente</a></td>
                    <td th:text="${c.dni}">00000000</td>
                    <td th:text="${c.telefono}">999999999</td>
                    <td>
                        <span th:if="${c.membresiaVigente != null}"
                              th:class="'badge ' + ${c.membresiaVigente.estado.css}"
                              th:text="${c.membresiaVigente.estado.label}">Activa</span>
                        <span th:if="${c.membresiaVigente == null}" class="badge muted">Sin membresía</span>
                    </td>
                    <td class="acciones">
                        <a class="btn btn-chico btn-linea" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
