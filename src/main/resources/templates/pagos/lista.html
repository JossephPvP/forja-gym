<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pagos')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('pagos')}"></aside>
    <main class="contenido">
        <div class="cabecera">
            <h1>Pagos</h1>
            <p class="cabecera-dato">Cobrado este mes:
                <strong th:text="'S/ ' + ${#numbers.formatDecimal(totalMes, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</strong>
            </p>
        </div>

        <p class="vacio" th:if="${#lists.isEmpty(pagos)}">Todavía no hay pagos. Se crean al registrar una membresía.</p>
        <div class="tabla-wrap" th:unless="${#lists.isEmpty(pagos)}">
            <table class="tabla">
                <thead><tr><th>Fecha</th><th>Cliente</th><th>Plan</th><th>Método</th><th>Monto</th></tr></thead>
                <tbody>
                <tr th:each="p : ${pagos}">
                    <td th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy HH:mm')}">01/01/2026 09:00</td>
                    <td><a th:href="@{/clientes/{id}(id=${p.membresia.cliente.id})}" th:text="${p.membresia.cliente.nombreCompleto}">Cliente</a></td>
                    <td th:text="${p.membresia.plan.nombre}">Mensual</td>
                    <td th:text="${p.metodo.label}">Efectivo</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.monto, 1, 'COMMA', 2, 'POINT')}">S/ 90.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
