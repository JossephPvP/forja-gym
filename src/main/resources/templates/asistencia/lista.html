<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Control de ingreso')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('asistencia')}"></aside>
    <main class="contenido">
        <div class="cabecera"><h1>Control de ingreso</h1></div>

        <div th:if="${error != null}" th:replace="~{fragments/layout :: mensajes}"></div>

        <section th:if="${resultado != null}" th:class="'resultado ' + (${resultado.permitido} ? 'si' : 'no')" role="status">
            <p class="resultado-estado" th:text="${resultado.permitido} ? 'Puede ingresar' : 'No puede ingresar'">Puede ingresar</p>
            <h2 th:text="${resultado.nombre}">Cliente</h2>
            <p th:text="${resultado.mensaje}">Mensaje</p>
            <a th:unless="${resultado.permitido}" class="btn btn-brasa"
               th:href="@{/membresias/nueva(clienteId=${resultado.clienteId})}">Renovar membresía</a>
        </section>

        <form class="ingreso-form ingreso-claro" th:action="@{/asistencia/ingreso}" method="post">
            <input type="text" name="dni" inputmode="numeric" maxlength="8" pattern="\d{8}"
                   placeholder="DNI de 8 dígitos" aria-label="DNI del cliente" autofocus required>
            <button type="submit" class="btn btn-brasa">Registrar ingreso</button>
        </form>

        <section class="bloque">
            <div class="bloque-cab"><h2>Visitas de hoy</h2></div>
            <p class="vacio" th:if="${#lists.isEmpty(asistencias)}">No hay ingresos registrados hoy.</p>
            <div class="tabla-wrap" th:unless="${#lists.isEmpty(asistencias)}">
                <table class="tabla">
                    <thead><tr><th>Hora</th><th>Cliente</th><th>Resultado</th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${asistencias}">
                        <td th:text="${#temporals.format(a.fechaHora, 'HH:mm')}">08:00</td>
                        <td><a th:href="@{/clientes/{id}(id=${a.cliente.id})}" th:text="${a.cliente.nombreCompleto}">Cliente</a></td>
                        <td>
                            <span th:class="'badge ' + (${a.permitido} ? 'ok' : 'bad')"
                                  th:text="${a.permitido} ? 'Ingresó' : 'Sin membresía'">Ingresó</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
