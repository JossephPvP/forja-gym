<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Membresías')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('membresias')}"></aside>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="cabecera">
            <h1>Membresías</h1>
            <a class="btn btn-brasa" th:href="@{/membresias/nueva}">Nueva membresía</a>
        </div>

        <p class="vacio" th:if="${#lists.isEmpty(membresias)}">Aún no hay membresías. Registra la primera con el botón de arriba.</p>
        <div class="tabla-wrap" th:unless="${#lists.isEmpty(membresias)}">
            <table class="tabla">
                <thead><tr><th>Cliente</th><th>Plan</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead>
                <tbody>
                <tr th:each="m : ${membresias}">
                    <td><a th:href="@{/clientes/{id}(id=${m.cliente.id})}" th:text="${m.cliente.nombreCompleto}">Cliente</a></td>
                    <td th:text="${m.plan.nombre}">Mensual</td>
                    <td th:text="${#temporals.format(m.fechaInicio, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${#temporals.format(m.fechaFin, 'dd/MM/yyyy')}">30/01/2026</td>
                    <td><span th:class="'badge ' + ${m.estado.css}" th:text="${m.estado.label}">Activa</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
