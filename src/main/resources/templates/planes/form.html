<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Plan')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('planes')}"></aside>
    <main class="contenido">
        <div class="cabecera">
            <h1 th:text="${plan.id == null} ? 'Crear plan' : 'Editar plan'">Crear plan</h1>
        </div>

        <form class="form" th:action="@{/planes}" th:object="${plan}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{activo}">

            <label class="campo">Nombre del plan
                <input type="text" th:field="*{nombre}" autocomplete="off">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </label>

            <label class="campo">Duración en días
                <input type="number" th:field="*{duracionDias}" min="1">
                <span class="error" th:if="${#fields.hasErrors('duracionDias')}" th:errors="*{duracionDias}"></span>
            </label>

            <label class="campo">Precio (S/)
                <input type="number" th:field="*{precio}" step="0.01" min="0">
                <span class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
            </label>

            <label class="campo campo-ancho">Descripción
                <input type="text" th:field="*{descripcion}" autocomplete="off">
            </label>

            <div class="form-acciones">
                <button type="submit" class="btn btn-brasa">Guardar plan</button>
                <a class="btn btn-linea" th:href="@{/planes}">Cancelar</a>
            </div>
        </form>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
