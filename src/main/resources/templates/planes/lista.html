<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Planes')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu('planes')}"></aside>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="cabecera">
            <h1>Planes</h1>
            <a class="btn btn-brasa" th:href="@{/planes/nuevo}">Crear plan</a>
        </div>

        <div class="tabla-wrap">
            <table class="tabla">
                <thead><tr><th>Plan</th><th>Duración</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${planes}">
                    <td>
                        <strong th:text="${p.nombre}">Mensual</strong>
                        <span class="sub" th:text="${p.descripcion}">Descripción</span>
                    </td>
                    <td th:text="${p.duracionDias} + (${p.duracionDias == 1} ? ' día' : ' días')">30 días</td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 90.00</td>
                    <td><span th:class="'badge ' + (${p.activo} ? 'ok' : 'muted')" th:text="${p.activo} ? 'Disponible' : 'Desactivado'">Disponible</span></td>
                    <td class="acciones">
                        <a class="btn btn-chico btn-linea" th:href="@{/planes/{id}/editar(id=${p.id})}">Editar</a>
                        <form th:action="@{/planes/{id}/estado(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-chico" th:text="${p.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
